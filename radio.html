<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إذاعة القرآن الكريم - المِسْبَحَةُ الرَّقَمِيَّةُ</title>
    <!-- Social Media Meta Tags -->
    <meta name="description" content="البث المباشر لإذاعة القرآن الكريم بتصميم إسلامي مميز.">
    <meta property="og:title" content="إذاعة القرآن الكريم - المِسْبَحَةُ الرَّقَمِيَّةُ">
    <meta property="og:description" content="استمع إلى البث المباشر لإذاعة القرآن الكريم بسهولة.">
    <meta property="og:image" content="https://joy-s-s.github.io/Ramadan-Tracker/masbaha.png">
    <meta property="og:url" content="https://joy-s-s.github.io/Ramadan-Tracker/radio.html">
    <meta property="og:type" content="website">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-90N7S5Q8EE"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-90N7S5Q8EE');
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="masbaha.png">
    <style>
        :root {
            --gold: #C6A84D;
            --gold-light: #E8D48B;
            --dark-green: #0D4D2B;
            --green: #1A7A4A;
            --light-green: #E8F5E9;
            --cream: #FFF8E7;
            --dark: #1a1a2e;
            --accent: #D4AF37;
            --border: #B8860B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0D4D2B 0%, #1a1a2e 50%, #0D4D2B 100%);
            min-height: 100vh;
            color: #333;
            padding: 20px;
            overscroll-behavior-y: none;
            touch-action: manipulation;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--cream);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            border: 3px solid var(--gold);
            display: flex;
            flex-direction: column;
            min-height: 90vh;
        }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(135deg, var(--dark-green) 0%, #0a3d22 50%, var(--dark-green) 100%);
            padding: 40px 30px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23C6A84D' fill-opacity='0.08'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.5;
        }

        .header-content {
            position: relative;
            z-index: 1;
        }

        .bismillah {
            font-family: 'Amiri', serif;
            font-size: 28px;
            color: var(--gold-light);
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(198, 168, 77, 0.3);
        }

        .main-title {
            font-family: 'Cairo', sans-serif;
            font-size: 36px;
            font-weight: 900;
            color: var(--gold);
            text-shadow: 0 2px 15px rgba(198, 168, 77, 0.4);
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .sub-title {
            font-size: 18px;
            color: var(--gold-light);
            font-weight: 600;
            opacity: 0.9;
        }

        .year-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--gold), var(--accent));
            color: var(--dark-green);
            padding: 5px 25px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 16px;
            margin-top: 10px;
        }

        /* ===== PLAYER SECTION ===== */
        .player-section {
            padding: 40px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f9f3e3;
        }

        .player-card {
            background: var(--white);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.05);
            border: 2px solid var(--gold);
            text-align: center;
            background: var(--cream);
            position: relative;
        }

        .track-info {
            margin-bottom: 30px;
        }

        .track-title {
            font-size: 24px;
            font-weight: 900;
            color: var(--dark-green);
            margin-bottom: 8px;
        }

        .track-sub {
            font-size: 16px;
            color: var(--green);
            font-weight: 600;
        }

        .play-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--dark-green) 0%, var(--green) 100%);
            border: 2px solid var(--gold);
            color: var(--gold-light);
            font-size: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            box-shadow: 0 10px 25px rgba(13, 77, 43, 0.3);
            margin-bottom: 30px;
        }

        .play-btn:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        /* ===== FOOTER ===== */
        .footer {
            background: var(--gold);
            padding: 15px;
            text-align: center;
            font-weight: 700;
            color: var(--dark-green);
            margin-top: auto;
        }

        /* Language Toggle & Nav Styles */
        .year-badge-container {
            margin-top: 10px;
        }

        .lang-switch {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0 0;
            position: relative;
            z-index: 100;
        }

        .lang-switch .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--gold);
            color: var(--gold-light);
            padding: 5px 15px;
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
            font-size: 14px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .lang-switch .nav-btn:hover {
            background: var(--gold);
            color: var(--dark-green);
        }

        @media (max-width: 768px) {
            body {
                padding: 8px;
            }

            .container {
                border-radius: 12px;
                border-width: 2px;
            }

            .header {
                padding: 25px 15px 20px;
            }

            .main-title {
                font-size: 22px;
                letter-spacing: 1px;
            }

            .sub-title {
                font-size: 14px;
            }

            .year-badge {
                font-size: 13px;
                padding: 4px 18px;
            }

            .player-card {
                padding: 30px 20px;
            }

            .play-btn {
                width: 80px;
                height: 80px;
                font-size: 32px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 4px;
            }

            .container {
                border-radius: 8px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- HEADER -->
        <header class="header">
            <div class="header-content">
                <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
                <h1 class="main-title">إِذَاعَةُ الْقُرْآنِ الْكَرِيمِ</h1>
                <p class="sub-title">استمع إلى كلام الله تعالى</p>
                <div class="year-badge-container">
                    <span class="year-badge">رمضان ١٤٤٧ هـ — ٢٠٢٦ م</span>
                </div>
                <div class="lang-switch">
                    <a href="tasbih.html" class="nav-btn">الأذكار</a>
                    <a href="quran.html" class="nav-btn">الختمة</a>
                    <a href="index.html" class="nav-btn">الجدول</a>
                </div>
            </div>
        </header>

        <!-- PLAYER -->
        <main class="player-section">
            <div class="player-card">
                <div class="track-info">
                    <div class="track-title">البث المباشر</div>
                    <div class="track-sub">إذاعة القرآن الكريم من القاهرة</div>
                </div>

                <div style="display: flex; flex-direction: column; align-items: center;">
                    <button id="playBtn" class="play-btn">
                        <i class="fas fa-play"></i>
                    </button>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div>« أَلا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ »</div>
        </footer>
    </div>

    <script>
        const STREAM_URL = "https://stream.radiojar.com/8s5u5tpdtwzuv";
        const audio = new Audio(STREAM_URL);
        const playBtn = document.getElementById('playBtn');

        let isPlaying = false;

        playBtn.onclick = () => {
            if (isPlaying) {
                audio.pause();
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
            } else {
                audio.play().catch(e => console.error("Playback failed:", e));
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            }
            isPlaying = !isPlaying;
        };
    </script>
</body>

</html>
