    <link rel="preconnect" href="https://fonts.googleapis.com">

        href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;900&display=swap"

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ===== RADIO-SPECIFIC STYLES ===== */
        body {
            display: flex;
            flex-direction: column;
        }

        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            flex: 1;
        }

        /* ===== PLAYER SECTION ===== */
        .player-section {
            padding: 40px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f9f3e3;
        }

        .player-card {
            background: var(--white);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.05);
            border: 2px solid var(--gold);
            text-align: center;
            background: var(--cream);
            position: relative;
        }

        .track-info {
            margin-bottom: 30px;
        }

        .track-title {
            font-size: 24px;
            font-weight: 900;
            color: var(--dark-green);
            margin-bottom: 8px;
        }

        .track-sub {
            font-size: 16px;
            color: var(--green);
            font-weight: 600;
        }

        .play-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--dark-green) 0%, var(--green) 100%);
            border: 2px solid var(--gold);
            color: var(--gold-light);
            font-size: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            box-shadow: 0 10px 25px rgba(13, 77, 43, 0.3);
            margin-bottom: 30px;
        }

        .play-btn:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        /* ===== FOOTER ===== */
        .footer {
            background: var(--gold);
            padding: 15px;
            text-align: center;
            font-weight: 700;
            color: var(--dark-green);
            margin-top: auto;
        }



        @media (max-width: 768px) {
            .player-card {
                padding: 30px 20px;
            }

            .play-btn {
                width: 80px;
                height: 80px;
                font-size: 32px;
            }
        }
    </style>
</head>

<body>
    <a href="#main-content" class="skip-link">تخطي إلى المحتوى</a>
    <div class="container">
        <!-- HEADER -->
        <header class="header" role="banner">
            <div class="header-content">
                <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
                <h1 class="main-title">إِذَاعَةُ الْقُرْآنِ الْكَرِيمِ</h1>
                <p class="sub-title">استمع إلى كلام الله تعالى</p>
                <div class="year-badge-container">
                    <span class="year-badge">رمضان ١٤٤٧ هـ — ٢٠٢٦ م</span>
                </div>
                <nav class="lang-switch" role="navigation" aria-label="التنقل الرئيسي">
                    <a href="tasbih.html" class="nav-btn" aria-label="الأذكار">الأذكار</a>
                    <a href="quran.html" class="nav-btn" aria-label="ختمة القرآن">الختمة</a>
                    <a href="index.html" class="nav-btn" aria-label="الجدول الرئيسي">الجدول</a>
                </nav>
            </div>
        </header>

        <!-- PLAYER -->
        <main class="player-section" id="main-content" role="main">
            <div class="player-card">
                <div class="track-info">
                    <div class="track-title">البث المباشر</div>
                    <div class="track-sub">إذاعة القرآن الكريم من القاهرة</div>
                </div>

                <div style="display: flex; flex-direction: column; align-items: center;">
                    <button id="playBtn" class="play-btn">
                        <i class="fas fa-play"></i>
                    </button>
                </div>
            </div>
        </main>

        <footer class="footer" role="contentinfo">
            <div>« أَلا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ »</div>
        </footer>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(() => { });
        }
    </script>

    <script>
        const STREAM_URL = "https://stream.radiojar.com/8s5u5tpdtwzuv";
        const audio = new Audio(STREAM_URL);
        const playBtn = document.getElementById('playBtn');

        let isPlaying = false;

        playBtn.onclick = () => {
            if (isPlaying) {
                audio.pause();
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
            } else {
                audio.play().catch(e => console.error("Playback failed:", e));
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            }
            isPlaying = !isPlaying;
        };
    </script>
</body>

</html>
