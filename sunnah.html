    <script>
        const sunnahData = {
            waking: [
                { id: 'w1', title: 'مسح أثر النوم باليد', titleEn: 'Wiping sleep with hand', hadith: 'كَانَ رَسُولُ اللَّهِ ﷺ إِذَا اسْتَيْقَظَ جَلَسَ يَمْسَحُ النَّوْمَ عَنْ وَجْهِهِ بِيَدِهِ', hadithEn: 'The Messenger of Allah ﷺ would sit up and wipe the sleep from his face with his hand.', source: 'رواه مسلم' },
                { id: 'w2', title: 'الحمد لله بعد الاستيقاظ', titleEn: 'Praise after Waking', hadith: 'الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَمَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ', hadithEn: 'Praise be to Allah who has given us life after taking it from us, and to Him is the resurrection.', source: 'رواهُ البخاري' },
                { id: 'w3', title: 'الدعاء بالعافية', titleEn: 'Supplication for Well-being', hadith: 'الْحَمْدُ لِلَّهِ الَّذِي عَافَانِي فِي جَسَدِي، وَرَدَّ عَلَيَّ رُوحِي، وَأَذِنَ لِي بِذِكْرِهِ', hadithEn: 'Praise be to Allah who has given my body health, and restored my soul to me, and permitted me to mention Him.', source: 'رواهُ الترمذي' },
                { id: 'w4', title: 'السواك عند الاستيقاظ', titleEn: 'Using Siwak', hadith: 'كَانَ النَّبِيُّ ﷺ إِذَا قَامَ مِنَ اللَّيْلِ يَشُوصُ فَاهُ بِالسِّوَاكِ', hadithEn: 'When the Prophet ﷺ woke up at night, he would clean his mouth with the Siwak.', source: 'متفقٌ عليه' },
                { id: 'w5', title: 'غسل اليدين ثلاثاً', titleEn: 'Washing hands 3x', hadith: 'إذَا اسْتَيْقَظَ أَحَدُكُمْ مِن نَوْمِهِ، فَلا يَغْمِسْ يَدَهُ في الإناءِ حتَّى يَغْسِلَها ثَلاثًا، فإنَّه لا يَدْرِي أيْنَ باتَتْ يَدُهُ', hadithEn: 'When one of you wakes up, he should not put his hand into the vessel until he washes it three times, for he does not know where his hand was.', source: 'متفقٌ عليه' },
                { id: 'w6', title: 'قراءة أواخر سورة آل عمران', titleEn: 'Reciting last verses of Al-Imran', hadith: 'كَانَ رَسُولُ اللَّهِ ﷺ إِذَا اسْتَيْقَظَ جَلَسَ يَمْسَحُ النَّوْمَ عَنْ وَجْهِهِ بِيَدِهِ، ثُمَّ قَرَأَ الآيَاتِ الْخَوَاتِمَ مِنْ سُورَةِ آلِ عِمْرَانَ: <br><br> إِنَّ فِي خَلْقِ السَّمَاوَاتِ وَالأَرْضِ وَاخْتِلافِ اللَّيْلِ وَالنَّهَارِ لَآيَاتٍ لِّأُولِي الأَلْبَابِ * الَّذِينَ يَذْكُرُونَ اللَّهَ قِيَامًا وَقُعُودًا وَعَلَىَ جُنُوبِهِمْ وَيَتَفَكَّرُونَ فِي خَلْقِ السَّمَاوَاتِ وَالأَرْضِ رَبَّنَا مَا خَلَقْتَ هَذَا بَاطِلاً سُبْحَانَكَ فَقِنَا عَذَابَ النَّارِ * رَبَّنَا إِنَّكَ مَن تُدْخِلِ النَّارَ فَقَدْ أَخْزَيْتَهُ وَمَا لِلظَّالِمِينَ مِنْ أَنصَارٍ * رَّبَّنَا إِنَّنَا سَمِعْنَا مُنَادِيًا يُنَادِي لِلإِيمَانِ أَنْ آمِنُواْ بِرَبِّكُمْ فَآمَنَّا رَبَّنَا فَاغْفِرْ لَنَا ذُنُوبَنَا وَكَفِّرْ عَنَّا سَيِّئَاتِنَا وَتَوَفَّنَا مَعَ الأَبْرَارِ * رَبَّنَا وَآتِنَا مَا وَعَدتَّنَا عَلَى رُسُلِكَ وَلاَ تُخْزِنَا يَوْمَ الْقِيَامَةِ إِنَّكَ لاَ تُخْلِفُ الْمِيعَادَ * فَاسْتَجَابَ لَهُمْ رَبُّهُمْ أَنِّي لاَ أُضِيعُ عَمَلَ عَامِلٍ مِّنكُم مِّن ذَكَرٍ أَوْ أُنثَى بَعْضُكُم مِّن بَعْضٍ فَالَّذِينَ هَاجَرُواْ وَأُخْرِجُواْ مِن دِيَارِهِمْ وَأُوذُواْ فِي سَبِيلِي وَقَاتَلُواْ وَقُتِلُواْ لأُكَفِّرَنَّ عَنْهُمْ سَيِّئَاتِهِمْ وَلأُدْخِلَنَّهُمْ جَنَّاتٍ تَجْرِي مِن تَحْتِهَا الأَنْهَارُ ثَوَابًا مِّن عِندِ اللَّهِ وَاللَّهُ عِندَهُ حُسْنُ الثَّوابِ * لاَ يَغُرَّنَّكَ تَقَلُّبُ الَّذِينَ كَفَرُواْ فِي الْبِلادِ * مَتَاعٌ قَلِيلٌ ثُمَّ مَأْوَاهُمْ جَهَنَّمُ وَبِئْسَ الْمِهَادُ * لَكِنِ الَّذِينَ اتَّقَوْا رَبَّهُمْ لَهُمْ جَنَّاتٌ تَجْرِي مِن تَحْتِهَا الأَنْهَارُ خَالِدِينَ فِيهَا نُزُلاً مِّنْ عِندِ اللَّهِ وَمَا عِندَ اللَّهِ خَيْرٌ لِّلأَبْرَارِ * وَإِنَّ مِنْ أَهْلِ الْكِتَابِ لَمَن يُؤْمِنُ بِاللَّهِ وَمَا أُنزِلَ إِلَيْكُمْ وَمَا أُنزِلَ إِلَيْهِمْ خَاشِعِينَ لِلَّهِ لاَ يَشْتَرُونَ بِآيَاتِ اللَّهِ ثَمَنًا قَلِيلاً أُوْلَئِكَ لَهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ إِنَّ اللَّهَ سَرِيعُ الْحِسَابِ * يَا أَيُّهَا الَّذِينَ آمَنُواْ اصْبِرُواْ وَصَابِرُواْ وَرَابِطُواْ وَاتَّقُواْ اللَّهَ لَعَلَّكُمْ تُفْلِحُونَ', hadithEn: 'The Messenger of Allah ﷺ would sit up and wipe the sleep from his face with his hand, then he would recite the last verses of Surah Al-Imran: "Indeed, in the creation of the heavens and the earth and the alternation of the night and the day are signs for those of understanding..."', source: 'متفقٌ عليه' },
                { id: 'w7', title: 'الاستنثار ثلاثاً', titleEn: 'Blowing nose 3x', hadith: 'إِذَا اسْتَيْقَظَ أَحَدُكُمْ مِنْ مَنَامِهِ فَتَوَضَّأَ فَلْيَسْتَنْثِرْ ثَلَاثَ مَرَّاتٍ، فَإِنَّ الشَّيْطَانَ يَبِيتُ عَلَى خَيَاشِيمِهِ', hadithEn: 'When one of you wakes up from his sleep and performs Wudu, he should blow his nose three times, for the Shaitan stays in the upper part of his nose during the night.', source: 'متفقٌ عليه' },
                { id: 'w8', title: 'الذكر عند التعار من الليل', titleEn: 'Dhikr when waking at night', hadith: 'مَنْ تَعَارَّ مِنَ اللَّيْلِ فَقَالَ: لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، الْحَمْدُ لِلَّهِ، وَسُبْحَانَ اللَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ، ثُمَّ قَالَ: اللَّهُمَّ اغْفِرْ لِي، أَوْ دَعَا، اسْتُجِيبَ لَهُ، فَإِنْ تَوَضَّأَ وَصَلَّى قُبِلَتْ صَلَاتُهُ', hadithEn: 'Whoever awakes at night and then says: "None has the right to be worshipped but Allah alone, Who has no partner...\", then says \"O Allah! Forgive me\" or makes another supplication, his supplication will be answered...', source: 'رواهُ البخاري' }
            ],
            friday: [
                { id: 'fr1', title: 'الاغتسال يوم الجمعة', titleEn: 'Perform Ghusl on Friday', hadith: 'إِذَا جَاءَ أَحَدُكُمُ الْجُمُعَةَ فَلْيَغْتَسِلْ', hadithEn: 'When any one of you comes to the Friday (prayer), he should take a bath.', source: 'متفقٌ عليه' },
                { id: 'fr2', title: 'السواك والتطيب', titleEn: 'Using Siwak and Perfume', hadith: 'عَلَى كُلِّ مُسْلِمٍ الْغُسْلُ يَوْمَ الْجُمُعَةِ، وَيَلْبَسُ مِنْ صَالِحِ ثِيَابِهِ، وَإِنْ كَانَ لَهُ طِيبٌ مَسَّ مِنْهُ، وَإِنْ لَمْ يَكُنْ فَالْمَاءُ لَهُ طِيبٌ', hadithEn: 'Every Muslim should take a bath on Friday and wear his best clothes, and if he has perfume, he should apply it.', source: 'رواهُ أحمد' },
                { id: 'fr3', title: 'التبكير إلى الصلاة', titleEn: 'Going Early to the Mosque', hadith: 'مَنِ اغْتَسَلَ يَوْمَ الْجُمُعَةِ غُسْلَ الْجَنَابَةِ ثُمَّ رَاحَ، فَكَأَنَّمَا قَرَّبَ بَدَنَةً، وَمَنْ رَاحَ فِي السَّاعَةِ الثَّانِيَةِ، فَكَأَنَّمَا قَرَّبَ بَقَرَةً، وَمَنْ رَاحَ فِي السَّاعَةِ الثَّالِثَةِ، فَكَأَنَّمَا قَرَّبَ كَبْشاً أَقْرَنَ، وَمَنْ رَاحَ فِي السَّاعَةِ الرَّابِعَةِ، فَكَأَنَّمَا قَرَّبَ دَجَاجَةً، وَمَنْ رَاحَ فِي السَّاعَةِ الْخَامِسَةِ، فَكَأَنَّمَا قَرَّبَ بَيْضَةً، فَإِذَا خَرَجَ الْإِمَامُ حَضَرَتِ الْمَلَائِكَةُ يَسْتَمِعُونَ الذِّكْرَ', hadithEn: 'Whoever takes a bath on Friday and then goes early to the mosque, it is as if he had sacrificed a camel... and when the Imam comes out, the angels present themselves to listen to the sermon.', source: 'متفقٌ عليه' },
                { id: 'fr4', title: 'المشي إلى المسجد', titleEn: 'Walking to the Mosque', hadith: 'مَنْ غَسَّلَ يَوْمَ الْجُمُعَةِ وَاغْتَسَلَ، ثُمَّ بَكَّرَ وَابْتَكَرَ، وَمَشَى وَلَمْ يَرْكَبْ، وَدَنَا مِنَ الْإِمَامِ فَاسْتَمَعَ وَلَمْ يَلْغُ، كَانَ لَهُ بِكُلِّ خُطْوَةٍ عَمَلُ سَنَةٍ أَجْرُ صِيَامِهَا وَقِيَامِهَا', hadithEn: 'Whoever washes his head and takes a bath on Friday, goes early, walks and does not ride... he will have the reward of a year\'s fasting and praying for every step he takes.', source: 'رواهُ أبو داود والترمذي' },
                { id: 'fr5', title: 'قراءة سورة الكهف', titleEn: 'Reciting Surah Al-Kahf', hadith: 'مَنْ قَرَأَ سُورَةَ الْكَهْفِ فِي يَوْمِ الْجُمُعَةِ؛ أَضَاءَ لَهُ مِنَ النُّورِ مَا بَيْنَ الْجُمُعَتَيْنِ', hadithEn: 'Whoever recites Surah Al-Kahf on Friday, a light will shine for him from one Friday to the next.', source: 'رواهُ الحاكمُ والبيهقي' },
                { id: 'fr6', title: 'الإكثار من الصلاة على النبي ﷺ', titleEn: 'Blessings on the Prophet ﷺ', hadith: 'أَكْثِرُوا الصَّلَاةَ عَلَيَّ يَوْمَ الْجُمُعَةِ وَلَيْلَةَ الْجُمُعَةِ؛ فَمَنْ صَلَّى عَلَيَّ صَلَاةً صَلَّى اللَّهُ عَلَيْهِ عَشْرًا', hadithEn: 'Abound in invoking blessings upon me on Friday and the night of Friday, for he who invokes a blessing on me once, Allah will bless him ten times.', source: 'رواهُ البيهقيُّ وصححه الألباني' },
                { id: 'fr7', title: 'تحري ساعة الاستجابة', titleEn: 'The Hour of Response', hadith: 'إِنَّ فِي الْجُمُعَةِ سَاعَةً، لَا يُوَافِقُهَا عَبْدٌ مُسْلِمٌ، وَهُوَ قَائِمٌ يُصَلِّي، يَسْأَلُ اللَّهَ خَيْراً إِلَّا أَعْطَاهُ إِيَّاهُ - وَأَشَارَ بِيَدِهِ يُقَلِّلُهَا', hadithEn: 'There is a time on Friday when if a Muslim slave stands and prays and asks Allah for something good, Allah will definitely give it to him. And he pointed with his hand to indicate how short that time is.', source: 'متفقٌ عليه' },
                { id: 'fr8', title: 'الإنصات للخطبة', titleEn: 'Listening to the Khutbah', hadith: 'إِذَا قُلْتَ لِصَاحِبِكَ يَوْمَ الْجُمُعَةِ: أَنْصِتْ، وَالْإِمَامُ يَخْطُبُ، فَقَدْ لَغَوْتَ', hadithEn: 'If you say to your companion on Friday: "Keep quiet" while the Imam is delivering the sermon, you have engaged in idle talk.', source: 'متفقٌ عليه' }
            ],
            fasting: [
                { id: 'fs1', title: 'تعجيل الفطر', titleEn: 'Hastening Iftar', hadith: 'لا يَزَالُ النَّاسُ بِخَيْرٍ مَا عَجَّلُوا الْفِطْرَ', hadithEn: 'People will remain on the right path as long as they hasten the breaking of the fast.', source: 'متفقٌ عليه' },
                { id: 'fs2', title: 'تأخير السحور', titleEn: 'Delaying Suhoor', hadith: 'تَسَحَّرُوا فَإِنَّ فِي السَّحُورِ بَرَكَةً', hadithEn: 'Eat Suhoor, for in Suhoor there is blessing.', source: 'متفقٌ عليه' },
                { id: 'fs3', title: 'الإفطار على التمر أو الماء', titleEn: 'Iftar with Dates/Water', hadith: 'إِذَا أَفْطَرَ أَحَدُكُمْ فَلْيُفْطِرْ عَلَى تَمْرٍ، فَإِنَّهُ بَرَكَةٌ، فَمَنْ لَمْ يَجِدْ فَلْيُفْطِرْ عَلَى مَاءٍ، فَإِنَّهُ طَهُورٌ', hadithEn: 'When one of you breaks his fast, let him break it with dates, for they are a blessing. If he cannot find dates, then with water, for it is pure.', source: 'رواهُ أبو داود والترمذي' },
                { id: 'fs4', title: 'الدعاء عند الإفطار', titleEn: 'Dua at Iftar', hadith: 'ذَهَبَ الظَّمَأُ، وَابْتَلَّتِ الْعُرُوقُ، وَثَبَتَ الأَجْرُ إِنْ شَاءَ اللَّهُ', hadithEn: 'The thirst is gone, the veins are moistened, and the reward is confirmed, if Allah wills.', source: 'رواهُ أبو داود' },
                { id: 'fs5', title: 'الصبر والترفع عن اللغو', titleEn: 'Patience & Avoiding Foul Speech', hadith: 'إِذَا كَانَ يَوْمُ صَوْمِ أَحَدِكُمْ، فَلَا يَرْفُثْ وَلَا يَصْخَبْ، فَإِنْ سَابَّهُ أَحَدٌ أَوْ قَاتَلَهُ، فَلْيَقُلْ: إِنِّي امْرُؤٌ صَائِمٌ', hadithEn: 'When any one of you is fasting on a day, he should neither indulge in obscene language nor should he raise his voice; and if anyone reviles him or tries to quarrel with him he should say: I am fasting.', source: 'متفقٌ عليه' }
            ],
            wudu: [
                { id: 'wd1', title: 'التسمية قبل الوضوء', titleEn: 'Basmala before Wudu', hadith: 'لَا صَلَاةَ لِمَنْ لَا وُضُوءَ لَهُ، وَلَا وُضُوءَ لِمَنْ لَمْ يَذْكُرِ اسْمَ اللَّهِ تَعَالَى عَلَيْهِ', hadithEn: 'There is no prayer for him who has no wudu, and no wudu for him who does not mention Allah\'s name over it.', source: 'رواه أبو داود' },
                { id: 'wd2', title: 'المضمضة والاستنشاق من كف واحدة', titleEn: 'Rinsing mouth & nose with one palm', hadith: 'فَتَمَضْمَضَ وَاسْتَنْشَقَ مِنْ كَفٍّ وَاحِدَةٍ (فَفَعَلَ ذَلِكَ ثَلَاثاً)', hadithEn: 'He rinsed his mouth and nose from a single handful of water (doing that three times).', source: 'متفق عليه' },
                { id: 'wd3', title: 'المبالغة في الاستنشاق لغير الصائم', titleEn: 'Exaggerating in inhalation', hadith: 'أَسْبِغِ الْوُضُوءَ وَخَلِّلْ بَيْنَ الْأَصَابِعِ وَبَالِغْ فِي الِاسْتِنْشَاقِ إِلَّا أَنْ تَكُونَ صَائِماً', hadithEn: 'Perform wudu thoroughly, rub between fingers and exaggerate in inhalation unless you are fasting.', source: 'رواه أبو داود' },
                { id: 'wd4', title: 'السواك مع الوضوء', titleEn: 'Siwak with Wudu', hadith: 'لَوْلَا أَنْ أَشُقَّ عَلَى أُمَّتِي لَأَمَرْتُهُمْ بِالسِّوَاكِ مَعَ كُلِّ وُضُوءٍ', hadithEn: 'If it were not for the hardship on my Ummah, I would have ordered them to use Siwak with every wudu.', source: 'رواه أحمد' },
                { id: 'wd5', title: 'تخليل الأصابع', titleEn: 'Cleaning between fingers', hadith: 'أَسْبِغِ الْوُضُوءَ وَخَلِّلْ بَيْنَ الْأَصَابِعِ', hadithEn: 'Perform wudu thoroughly and rub between the fingers.', source: 'رواه الترمذي' },
                { id: 'wd6', title: 'الذكر المستحب بعد الوضوء', titleEn: 'Dua after Wudu', hadith: 'أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّداً عَبْدُهُ وَرَسُولُهُ، اللَّهُمَّ اجْعَلْنِي مِنَ التَّوَّابِينَ وَاجْعَلْنِي مِنَ الْمُتَطَهِّرِينَ', hadithEn: 'I bear witness that there is no deity besides Allah alone... O Allah, make me among those who repent and those who are purified.', source: 'رواه الترمذي' },
                { id: 'wd7', title: 'صلاة ركعتين بعد الوضوء', titleEn: 'Two Rak\'ahs after Wudu', hadith: 'مَنْ تَوَضَّأَ نَحْوَ وُضُوئِي هَذَا، ثُمَّ صَلَّى رَكْعَتَيْنِ لَا يُحَدِّثُ فِيهِمَا نَفْسَهُ، غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ', hadithEn: 'Whoever performs wudu like mine and prays two rak\'ahs without thinking of worldly matters, his past sins will be forgiven.', source: 'متفق عليه' },
                { id: 'wd8', title: 'البدء باليمين', titleEn: 'Starting with the right', hadith: 'كَانَ النَّبِيُّ ﷺ يُعْجِبُهُ التَّيَمُّنُ فِي تَنَعُّلِهِ، وَتَرَجُّلِهِ، وَطُهُورِهِ، وَفِي شَأْنِهِ كُلِّهِ', hadithEn: 'The Prophet ﷺ used to like to start from the right side on wearing shoes, combing his hair, cleaning himself, and in all his affairs.', source: 'متفق عليه' },
                { id: 'wd9', title: 'الاقتصاد في الماء', titleEn: 'Economy in water', hadith: 'كَانَ النَّبِيُّ ﷺ يَتَوَضَّأُ بِالْمُدِّ، وَيَغْتَسِلُ بِالصَّاعِ، إِلَى خَمْسَةِ أَمْدَادٍ', hadithEn: 'The Prophet ﷺ used to perform Wudu with one Mudd of water and Ghusl with one Sa\' up to five Mudds.', source: 'متفق عليه' },
                { id: 'wd10', title: 'فضل الذكر بعد الوضوء', titleEn: 'Virtue of Dua after Wudu', hadith: 'مَا مِنْكُمْ مِنْ أَحَدٍ يَتَوَضَّأُ فَيُبْلِغُ -أَوْ فَيُسْبِغُ- الْوُضُوءَ ثُمَّ يَقُولُ: أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللهُ وَأَنَّ مُحَمَّدًا عَبْدُ اللهِ وَرَسُولُهُ؛ إِلَّا فُتِحَتْ لَهُ أَبْوَابُ الْجَنَّةِ الثَّمَانِيَةُ يَدْخُلُ مِنْ أَيِّهَا شَاءَ', hadithEn: 'If anyone amongst you performs the Wudu, and then says: I testify that there is no god but Allah and that Muhammad is the servant of Allah and His Messenger; the eight gates of Paradise will be opened for him and he may enter by whichever of them he wishes.', source: 'رواه مسلم' }
            ],
            prayer: [
                { id: 'p1', title: 'السواك قبل الصلاة', titleEn: 'Siwak before Prayer', hadith: 'لَوْلَا أَنْ أَشُقَّ عَلَى أُمَّتِي لَأَمَرْتُهُمْ بِالسِّوَاكِ عِنْدَ كُلِّ صَلَاةٍ', hadithEn: 'If it were not for the hardship on my Ummah, I would have ordered them to use Siwak before every prayer.', source: 'متفق عليه' },
                { id: 'p2', title: 'دعاء الاستفتاح', titleEn: 'Opening Supplication', hadith: 'سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، وَتَبَارَكَ اسْمُكَ وَتَعَالَى جَدُّكَ، وَلَا إِلَهَ غَيْرُكَ', hadithEn: 'Glory be to You, O Allah, and all praise. Blessed be Your name, and exalted be Your majesty, and there is no deity besides You.', source: 'رواه مسلم' },
                { id: 'p3', title: 'التأمين بعد الفاتحة', titleEn: 'Saying Ameen', hadith: 'إذَا أَمَّنَ الإِمَامُ فَأَمِّنُوا، فإنَّه مَن وافَقَ تَأْمِينُهُ تَأْمِينَ المَلَائِكَةِ غُفِرَ له ما تَقَدَّمَ مِن ذَنْبِهِ', hadithEn: 'When the Imam says Ameen, say Ameen, for if one\'s Ameen coincides with that of the angels, his past sins will be forgiven.', source: 'متفق عليه' },
                { id: 'p4', title: 'السنن الرواتب (١٢ ركعة)', titleEn: 'Sunnah Rawatib (12 Rak\'ahs)', hadith: 'مَا مِنْ عَبْدٍ مُسْلِمٍ يُصَلِّي لِلَّهِ كُلَّ يَوْمٍ ثِنْتَيْ عَشْرَةَ رَكْعَةً تَطَوُّعاً غَيْرَ فَرِيضَةٍ، إِلَّا بَنَى اللَّهُ لَهُ بَيْتاً فِي الْجَنَّةِ', hadithEn: 'No Muslim servant prays twelve voluntary rak\'ahs every day but Allah builds a house for him in Paradise.', source: 'رواه مسلم' },
                { id: 'p5', title: 'صلاة الضحى (صدقة الأعضاء)', titleEn: 'Duha Prayer (Charity for Joints)', hadith: 'يُصْبِحُ علَى كُلِّ سُلَامَى مِن أَحَدِكُمْ صَدَقَةٌ، فَكُلُّ تَسْبِيحَةٍ صَدَقَةٌ، وَكُلُّ تَحْمِيدَةٍ صَدَقَةٌ، وَكُلُّ تَهْلِيلَةٍ صَدَقَةٌ، وَكُلُّ تَكْبِيرَةٍ صَدَقَةٌ، وَأَمْرٌ بالمَعروفِ صَدَقَةٌ، وَنَهْيٌ عَنِ المُنْكَرِ صَدَقَةٌ، وَيُجْزِئُ مِن ذلكَ رَكْعَتَانِ يَرْكَعُهُما مِنَ الضُّحَى', hadithEn: 'In the morning charity is due from every bone-joint of the body... Every tasbih is charity, every tahmid is charity, every tahlil is charity, every takbir is charity, enjoining good is charity, forbidding evil is charity, and two rak\'ahs which one prays in the Duha suffice for all that.', source: 'رواه مسلم' },
                { id: 'p6', title: 'تغيير المكان لصلاة النافلة', titleEn: 'Changing Place for Sunnah', hadith: 'أَمَرَنَا رَسُولُ اللَّهِ ﷺ أَنْ لَا نُوصِلَ صَلَاةً بِصَلَاةٍ حَتَّى نَتَكَلَّمَ أَوْ نَخْرُجَ', hadithEn: 'The Messenger of Allah ﷺ ordered us not to connect one prayer with another until we have spoken or gone out.', source: 'رواهُ مسلم' },
                { id: 'p7', title: 'صلاة الوتر', titleEn: 'Witr Prayer', hadith: 'اجْعَلُوا آخِرَ صَلَاتِكُمْ بِاللَّيْلِ وِتْراً', hadithEn: 'Make your last prayer at night Witr.', source: 'متفق عليه' },
                { id: 'p8', title: 'الأذكار الواردة بعد الصلاة', titleEn: 'Adhkar after Prayer', hadith: 'مَنْ سَبَّحَ اللَّهَ فِي دُبُرِ كُلِّ صَلَاةٍ ثَلَاثاً وَثَلَاثِينَ، وَحَمِدَ اللَّهَ ثَلَاثاً وَثَلَاثِينَ، وَكَبَّرَ اللَّهَ ثَلَاثاً وَثَلَاثِينَ، فَتِلْكَ تِسْعَةٌ وَتِسْعُونَ، وَقَالَ تَمَامَ الْمِائَةِ: لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، غُفِرَتْ خَطَايَاهُ وَإِنْ كَانَتْ مِثْلَ زَبَدِ الْبَحْرِ', hadithEn: 'If anyone extols Allah thirty-three times after every prayer, and praises Allah thirty-three times, and declares His greatness thirty-three times, ninety-nine in all, and says to complete a hundred: There is no god but Allah, having no partner with Him... his sins will be forgiven even if they are as abundant as the foam of the sea.', source: 'رواه مسلم' },
                { id: 'p9', title: 'سنة الفجر', titleEn: 'The Two Sunnah Rak’ahs of Fajr', hadith: 'رَكْعَتَا الْفَجْرِ خَيْرٌ مِنَ الدُّنْيَا وَمَا فِيهَا', hadithEn: 'The two rak\'ahs of Fajr are better than this world and all it contains.', source: 'رواه مسلم' },
                { id: 'p10', title: 'الصلاة إلى سترة', titleEn: 'Praying Towards a Sutra', hadith: 'إِذَا صَلَّى أَحَدُكُمْ فَلْيُصَلِّ إِلَى سُتْرَةٍ وَلْيَدْنُ مِنْهَا', hadithEn: 'When one of you prays, let him pray towards a Sutra and stay close to it.', source: 'رواه أبو داود' },
                { id: 'p11', title: 'الدعاء بين السجدتين', titleEn: 'Supplication Between Prostrations', hadith: 'رَبِّ اغْفِرْ لِي، رَبِّ اغْفِرْ لِي', hadithEn: 'O Lord forgive me, O Lord forgive me.', source: 'رواهُ النسائي' }
            ],
            mosque: [
                { id: 'm1', title: 'دعاء الذهاب إلى المسجد', titleEn: 'Dua going to Mosque', hadith: 'اللَّهُمَّ اجْعَلْ في قَلْبِي نُورًا، وفِي لِسَانِي نُورًا، وفِي سَمْعِي نُورًا، وفِي بَصَرِي نُورًا، وَمِنْ فَوْقِي نُورًا، وَمِنْ تَحْتِي نُورًا، وَعَنْ يَمِينِي نُورًا، وَعَنْ شِمَالِي نُورًا، وَمِنْ أَمَامِي نُورًا، وَمِنْ خَلْفِي نُورًا، وَاجْعَلْ في نَفْسِي نُورًا، وَأَعْظِمْ لي نُورًا', hadithEn: 'O Allah, place light in my heart, light in my tongue, light in my hearing, light in my sight, and light in all directions around me.', source: 'رواه مسلم' },
                { id: 'm2', title: 'الدخول باليمين والدعاء المأثور', titleEn: 'Entering with Right Foot', hadith: 'إِذَا دَخَلَ أَحَدُكُمُ الْمَسْجِدَ فَلْيُسَلِّمْ عَلَى النَّبِيِّ ﷺ وَلْيَقُلْ: اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ، وَإِذَا خَرَجَ فَلْيَقُلْ: اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ', hadithEn: 'When one of you enters the mosque, let him send blessings upon the Prophet ﷺ and say: O Allah, open for me the gates of Your mercy.', source: 'رواه مسلم' },
                { id: 'm3', title: 'تحية المسجد', titleEn: 'Greeting the Mosque', hadith: 'إِذَا دَخَلَ أَحَدُكُمُ الْمَسْجِدَ فَلَا يَجْلِسْ حَتَّى يُصَلِّيَ رَكْعَتَيْنِ', hadithEn: 'When one of you enters the mosque, he should not sit down until he prays two rak\'ahs.', source: 'متفق عليه' },
                { id: 'm4', title: 'التبكير للصلاة والصف الأول', titleEn: 'Early to Prayer & 1st Row', hadith: 'لَوْ يَعْلَمُ النَّاسُ ما في النِّدَاءِ والصَّفِّ الأوَّلِ، ثُمَّ لَمْ يَجِدُوا إلَّا أنْ يَسْتَهِمُوا عليه لَاسْتَهَمُوا', hadithEn: 'If people knew what is in the call and the first row, and they could find no other way but to cast lots for it, they would do so.', source: 'متفق عليه' },
                { id: 'm5', title: 'الدعاء عند الخروج من المسجد', titleEn: 'Dua when leaving Mosque', hadith: 'وَإِذَا خَرَجَ فَلْيَقُلْ: اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ (جزء من حديث الدخول)', hadithEn: 'And when he leaves, let him say: O Allah, I ask You from Your bounty.', source: 'رواه مسلم' },
                { id: 'm6', title: 'تقديم الرجل اليسرى عند الخروج', titleEn: 'Exiting with the Left Foot', hadith: 'كَانَ النَّبِيُّ ﷺ يَبْدَأُ بِالرِّجْلِ الْيُمْنَى إِذَا دَخَلَ الْمَسْجِدَ، وَبِالْيُسْرَى إِذَا خَرَجَ', hadithEn: 'The Prophet ﷺ would start with the right foot when entering the mosque, and with the left when exiting.', source: 'رواه الحاكم' },
                { id: 'm7', title: 'اغتنام الدعاء بين الأذان والإقامة', titleEn: 'Supplication Between Adhan and Iqamah', hadith: 'الدُّعَاءُ لَا يُرَدُّ بَيْنَ الْأَذَانِ وَالْإِقَامَةِ', hadithEn: 'A supplication made between the Adhan and the Iqamah is not rejected.', source: 'رواهُ الترمذي' },
                { id: 'm8', title: 'الترديد خلف المؤذن', titleEn: 'Repeating After the Mu\'adhin', hadith: 'إِذَا سَمِعْتُمُ الْمُؤَذِّنَ فَقُولُوا مِثْلَ مَا يَقُولُ', hadithEn: 'When you hear the Mu\'adhin, say what he says.', source: 'متفقٌ عليه' }
            ],
            food: [
                { id: 'f1', title: 'الأكل باليمين ومما يليك', titleEn: 'Eating with Right Hand', hadith: 'يَا غُلَامُ، سَمِّ اللَّهَ، وَكُلْ بِيَمِينِكَ، وَكُلْ مِمَّا يَلِيكَ', hadithEn: 'O boy, mention Allah\'s name, eat with your right hand, and eat from what is in front of you.', source: 'متفق عليه' },
                { id: 'f2', title: 'حمد الله بعد الطعام والشراب', titleEn: 'Praise after Food & Drink', hadith: 'إِنَّ اللَّهَ لَيَرْضَى عَنِ الْعَبْدِ أَنْ يَأْكُلَ الْأَكْلَةَ فَيَحْمَدَهُ عَلَيْهَا، أَوْ يَشْرَبَ الشَّرْبَةَ فَيَحْمَدَهُ عَلَيْهَا', hadithEn: 'Allah is pleased with an individual who mentions His praise after taking a morsel of food or a drink.', source: 'رواه مسلم' },
                { id: 'f3', title: 'التسمية عند النسيان', titleEn: 'Basmala when forgotten', hadith: 'إِذَا أَكَلَ أَحَدُكُمْ فَلْيَذْكُرِ اسْمَ اللَّهِ تَعَالَى، فَإِنْ نَسِيَ أَنْ يَذْكُرَ اسْمَ اللَّهِ تَعَالَى فِي أَوَّلِهِ فَلْيَقُلْ: بِسْمِ اللَّهِ أَوَّلَهُ وَآخِرَهُ', hadithEn: 'When one of you eats, he should mention the name of Allah; if he forgets, let him say: Bismillah in its beginning and end.', source: 'رواه أبو داود' },
                { id: 'f4', title: 'لعق الأصابع والقصعة', titleEn: 'Licking Fingers & Bowl', hadith: 'وَلَا يَمْسَحْ يَدَهُ بِالْمِنْدِيلِ حَتَّى يَلْعَقَ أَصَابِعَهُ؛ فَإِنَّهُ لَا يَدْرِي فِي أَيِّ طَعَامِهِ الْبَرَكَةُ', hadithEn: 'And he should not wipe his hand with a cloth until he has licked his fingers; for he does not know in which part of his food the blessing lies.', source: 'رواه مسلم' },
                { id: 'f5', title: 'التنفس خارج الإناء ثلاثاً', titleEn: 'Breathing 3x outside vessel', hadith: 'أَنَّ رَسُولَ اللَّهِ ﷺ كَانَ يَتَنَفَّسُ فِي الشَّرَابِ ثَلَاثاً', hadithEn: 'The Messenger of Allah ﷺ used to breathe three times in the course of drinking (outside the vessel).', source: 'متفق عليه' },
                { id: 'f6', title: 'الأكل من جوانب القصعة', titleEn: 'Eating from sides of bowl', hadith: 'الْبَرَكَةُ تَنْزِلُ وَسَطَ الطَّعَامِ، فَكُلُوا مِنْ حَافَتَيْهِ، وَلَا تَأْكُلُوا مِنْ وَسَطِهِ', hadithEn: 'The blessing descends in the middle of the food, so eat from the sides and do not eat from the middle.', source: 'رواه الترمذي' },
                { id: 'f7', title: 'شرب الماء جالساً', titleEn: 'Drinking while sitting', hadith: 'لَا يَشْرَبَنَّ أَحَدٌ مِنْكُمْ قَائِماً، فَمَنْ نَسِيَ فَلْيَسْتَقِئْ', hadithEn: 'None of you should drink while standing; and if anyone forgets, he must vomit.', source: 'رواه مسلم' },
                { id: 'f8', title: 'اجتماع الجماعة على الطعام', titleEn: 'Eating Together in Groups', hadith: 'اجْتَمِعُوا عَلَى طَعَامِكُمْ يُبَارَكْ لَكُمْ فِيهِ', hadithEn: 'Eat together, for then you will be blessed in it.', source: 'رواهُ أبو داود' },
                { id: 'f9', title: 'لعق القصعة ومسح الإناء', titleEn: 'Cleaning the Plate and Vessel', hadith: 'أَمَرَنَا رَسُولُ اللَّهِ ﷺ أَنْ نَسْلُتَ الْقَصْعَةَ، وَقَالَ: إِنَّكُمْ لَا تَدْرُونَ فِي أَيِّ طَعَامِكُمُ الْبَرَكَةُ', hadithEn: 'The Messenger of Allah ﷺ ordered us to clean the dish and said: You do not know in which portion the blessing resides.', source: 'رواهُ مسلم' },
                { id: 'f10', title: 'النهي عن النفخ في الإناء', titleEn: 'Not Blowing into the Vessel', hadith: 'نَهَى رَسُولُ اللَّهِ ﷺ أَنْ يُتَنَفَّسَ فِي الْإِنَاءِ أَوْ يُنْفَخَ فِيهِ', hadithEn: 'The Messenger of Allah ﷺ forbade breathing into the vessel or blowing into it.', source: 'رواهُ أبو داود' }
            ],
            home: [
                { id: 'h1', title: 'ذكر الله عند الدخول', titleEn: 'Mentioning Allah at Entrance', hadith: 'إِذَا دَخَلَ الرَّجُلُ بَيْتَهُ، فَذَكَرَ اللَّهَ عِنْدَ دُخُولِهِ وَعِنْدَ طَعَامِهِ، قَالَ الشَّيْطَانُ: لَا مَبِيتَ لَكُمْ، وَلَا عَشَاءَ، وَإِذَا دَخَلَ، فَلَمْ يَذْكُرِ اللَّهَ عِنْدَ دُخُولِهِ، قَالَ الشَّيْطَانُ: أَدْرَكْتُمُ الْمَبِيتَ', hadithEn: 'When a man enters his house and mentions Allah at his entrance and over his food, Satan says: No place to stay and no supper for you.', source: 'رواه مسلم' },
                { id: 'h2', title: 'صلاة ركعتين عند الدخول والخروج', titleEn: '2 Rak\'ahs when entering/exiting home', hadith: 'إِذَا خَرَجْتَ مِنْ مَنْزِلِكَ فَصَلِّ رَكْعَتَيْنِ تَمْنَعَانِكَ مَخْرَجَ السُّوءِ، وَإِذَا دَخَلْتَ إِلَى مَنْزِلِكَ فَصَلِّ رَكْعَتَيْنِ تَمْنَعَانِكَ مَدْخَلَ السُّوءِ', hadithEn: 'When you leave your house, pray two rak\'ahs, they will protect you from an evil exit; and when you enter your house, pray two rak\'ahs, they will protect you from an evil entrance.', source: 'رواه البزار' },
                { id: 'h3', title: 'إفشاء السلام على الأهل', titleEn: 'Spreading Salam to Family', hadith: 'يَا بُنَيَّ إِذَا دَخَلْتَ عَلَى أَهْلِكَ فَسَلِّمْ تَكُنْ بَرَكَةً عَلَيْكَ وَعَلَى أَهْلِ بَيْتِكَ', hadithEn: 'O son, when you enter your house, say Salam; it will be a blessing for you and your family.', source: 'رواهُ الترمذي' },
                { id: 'h4', title: 'السواك عند دخول المنزل', titleEn: 'Siwak when entering home', hadith: 'أَنَّ النَّبِيَّ ﷺ كَانَ إِذَا دَخَلَ بَيْتَهُ بَدَأَ بِالسِّوَاكِ', hadithEn: 'The Prophet ﷺ, upon entering his house, would first use the Siwak.', source: 'رواهُ مسلم' },
                { id: 'h5', title: 'عدم عيب الطعام', titleEn: 'Not criticizing food', hadith: 'مَا عَابَ النَّبِيُّ ﷺ طَعَاماً قَطُّ، إِنِ اشْتَهَاهُ أَكَلَهُ وَإِنْ كَرِهَهُ تَرَكَهُ', hadithEn: 'The Prophet ﷺ never criticized any food; if he liked it, he would eat it, and if he disliked it, he would leave it.', source: 'متفق عليه' }
            ],
            dressing: [
                { id: 'dr1', title: 'دعاء الثوب الجديد', titleEn: 'Dua for new clothes', hadith: 'اللَّهُمَّ لَكَ الْحَمْدُ، أَنْتَ كَسَوْتَنِيهِ، أَسْأَلُكَ مِنْ خَيْرِهِ وَخَيْرِ مَا صُنِعَ لَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّهِ وَشَرِّ مَا صُنِعَ لَهُ', hadithEn: 'O Allah, to You is the praise, You have clothed me with it. I ask You for its good and the good of what it was made for, and I seek refuge in You from its evil and the evil of what it was made for.', source: 'رواهُ أبو داود والترمذي' },
                { id: 'dr2', title: 'البدء باليمين في اللباس', titleEn: 'Starting with the right', hadith: 'إِذَا لَبِسْتُمْ فَابْدَأُوا بِأَيَامِنِكُمْ', hadithEn: 'When you dress, start with your right side.', source: 'رواهُ أبو داود والترمذي' },
                { id: 'dr3', title: 'التسمية عند خلع الثياب', titleEn: 'Bismillah when undressing', hadith: 'سِتْرُ مَا بَيْنَ أَعْيُنِ الْجِنِّ وَعَوْرَاتِ بَنِي آدَمَ: إِذَا وَضَعَ أَحَدُهُمْ ثَوْبَهُ أَنْ يَقُولَ: بِسْمِ اللَّهِ', hadithEn: 'The screen between the eyes of the Jinn and the nakedness of the children of Adam is that when one of them puts off his clothes, he says: Bismillah.', source: 'رواهُ الطبراني' },
                { id: 'dr4', title: 'دعاء النظر في المرآة', titleEn: 'Dua looking in mirror', hadith: 'اللَّهُمَّ أَنْتَ حَسَّنْتَ خَلْقِي فَحَسِّنْ خُلُقِي', hadithEn: 'O Allah, You have made my physical creation beautiful, so make my character beautiful.', source: 'رواهُ أحمد' },
                { id: 'dr5', title: 'استحباب لبس الثياب البيض', titleEn: 'Wearing White Clothes', hadith: 'الْبَسُوا مِنْ ثِيَابِكُمُ الْبَيَاضَ؛ فَإِنَّهَا مِنْ خَيْرِ ثِيَابِكُمْ', hadithEn: 'Wear white clothes, for they are the best of your garments.', source: 'رواهُ أبو داود' },
                { id: 'dr6', title: 'تقديم الشمال عند خلع النعل', titleEn: 'Removing the Left Shoe First', hadith: 'إِذَا انْتَعَلَ أَحَدُكُمْ فَلْيَبْدَأْ بِالْيَمِينِ، وَإِذَا نَزَعَ فَلْيَبْدَأْ بِالشِّمَالِ', hadithEn: 'When one of you puts on shoes, let him begin with the right, and when he takes them off, let him begin with the left.', source: 'متفقٌ عليه' }
            ],
            social: [
                { id: 'sc1', title: 'كفارة المجلس عند القيام', titleEn: 'Expiation of Meeting', hadith: 'مَنْ جَلَسَ فِي مَجْلِسٍ فَكَثُرَ فِيهِ لَغَطُهُ فَقَالَ قَبْلَ أَنْ يَقُومَ مِنْ مَجْلِسِهِ ذَلِكَ: سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ، إِلَّا غُفِرَ لَهُ مَا كَانَ فِي مَجْلِسِهِ ذَلِكَ', hadithEn: 'Whoever sits in a gathering and speaks much, then says before standing from that gathering of his: "Glory be to You, O Allah, and with Your praise; I bear witness that there is no god but You; I ask Your forgiveness and I repent to You," but he will be forgiven for what took place in that gathering of his.', source: 'رواه الترمذي' },
                { id: 'sc2', title: 'إلقاء السلام عند الدخول والقيام', titleEn: 'Salam when arriving/leaving', hadith: 'إِذَا انْتَهَى أَحَدُكُمْ إِلَى الْمَجْلِسِ فَلْيُسَلِّمْ، فَإِذَا أَرَادَ أَنْ يَقُومَ فَلْيُسَلِّمْ، فَلَيْسَتِ الْأُولَى بِأَحَقَّ مِنَ الْآخِرَةِ', hadithEn: 'When one of you arrives at a gathering, let him say Salam, and when he leaves, let him say Salam; for the first is not more important than the last.', source: 'رواه الترمذي' },
                { id: 'sc3', title: 'الجلوس حيث ينتهي به المجلس', titleEn: 'Sitting at the end', hadith: 'أَنَّ رَسُولَ اللَّهِ ﷺ كَانَ إِذَا أَتَى مَجْلِساً جَلَسَ حَيْثُ يَنْتَهِي بِهِ الْمَجْلِسُ', hadithEn: 'When the Messenger of Allah ﷺ came to a gathering, he would sit where the gathering ended.', source: 'رواه أبو داود' },
                { id: 'sc4', title: 'التفسح في المجالس', titleEn: 'Making room for others', hadith: 'يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا قِيلَ لَكُمْ تَفَسَّحُوا فِي الْمَجَالِسِ فَافْسَحُوا يَفْسَحِ اللَّهُ لَكُمْ', hadithEn: 'O you who have believed, when you are told, "Space yourselves" in assemblies, then make space; Allah will make space for you.', source: 'سورة المجادلة' },
                { id: 'sc5', title: 'الذكر في المجلس', titleEn: 'Mentioning Allah in gathering', hadith: 'مَا جَلَسَ قَوْمٌ مَجْلِساً لَمْ يَذْكُرُوا اللَّهَ فِيهِ، وَلَمْ يُصَلُّوا عَلَى نَبِيِّهِمْ، إِلَّا كَانَ عَلَيْهِمْ تِرَةً، فَإِنْ شَاءَ عَذَّبَهُمْ وَإِنْ شَاءَ غَفَرَ لَهُمْ', hadithEn: 'No people sit in a gathering without mentioning Allah and sending blessings on the Prophet, but they will have a regret.', source: 'رواه الترمذي' },
                { id: 'sc6', title: 'عيادة المريض وتطييب نفسه', titleEn: 'Visiting & Cheering the Sick', hadith: 'لَا بَأْسَ، طَهُورٌ إِنْ شَاءَ اللَّهُ', hadithEn: 'No harm, it is a purification, if Allah wills.', source: 'رواه البخاري' },
                { id: 'sc7', title: 'إلقاء السلام على الصبيان', titleEn: 'Greeting Children with Salam', hadith: 'أَنَّ رَسُولَ اللَّهِ ﷺ مَرَّ عَلَى صِبْيَانٍ فَسَلَّمَ عَلَيْهِمْ', hadithEn: 'The Messenger of Allah ﷺ passed by some boys and greeted them with Salam.', source: 'متفقٌ عليه' },
                { id: 'sc8', title: 'التأني والبيان في الكلام', titleEn: 'Clear and Deliberate Speech', hadith: 'كَانَ كَلَامُ رَسُولِ اللَّهِ ﷺ كَلَاماً فَصْلاً يَفْهَمُهُ كُلُّ مَنْ سَمِعَهُ', hadithEn: 'The speech of the Messenger of Allah ﷺ was clear and deliberate, such that everyone who heard it understood it.', source: 'رواهُ أبو داود' },
                { id: 'sc9', title: 'عدم التفريق بين اثنين في المجلس', titleEn: 'Not Separating Between Two Sitting Together', hadith: 'لَا يَحِلُّ لِلرَّجُلِ أَنْ يُفَرِّقَ بَيْنَ اثْنَيْنِ إِلَّا بِإِذْنِهِمَا', hadithEn: 'It is not lawful for a man to separate two people sitting together unless they give permission.', source: 'رواهُ أبو داود' }
            ],
            ethics: [
                { id: 'et1', title: 'التبسم في وجه الأخ', titleEn: 'Smiling at your brother', hadith: 'تَبَسُّمُكَ فِي وَجْهِ أَخِيكَ لَكَ صَدَقَةٌ', hadithEn: 'Your smiling in the face of your brother is charity for you.', source: 'رواهُ الترمذي' },
                { id: 'et2', title: 'المصافحة', titleEn: 'Shaking hands', hadith: 'مَا مِنْ مُسْلِمَيْنِ يَلْتَقِيَانِ فَيَتَصَافَحَانِ إِلَّا غُفِرَ لَهُمَا قَبْلَ أَنْ يَتَفَرَّقَا', hadithEn: 'Two Muslims do not meet and shake hands but their sins are forgiven before they separate.', source: 'رواهُ أبو داود والترمذي' },
                { id: 'et3', title: 'كظم الغيظ', titleEn: 'Suppressing anger', hadith: 'لَيْسَ الشَّدِيدُ بِالصُّرَعَةِ، إِنَّمَا الشَّدِيدُ الَّذِي يَمْلِكُ نَفْسَهُ عِنْدَ الْغَضَبِ', hadithEn: 'The strong man is not the one who can overpower others (in wrestling); rather, the strong man is the one who controls himself when he gets angry.', source: 'متفقٌ عليه' },
                { id: 'et4', title: 'الكلمة الطيبة', titleEn: 'The kind word', hadith: 'وَالْكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ', hadithEn: 'And a kind word is charity.', source: 'متفقٌ عليه' }
            ],
            travel: [
                { id: 'tr1', title: 'دعاء الركوب والسفر', titleEn: 'Dua for Travel', hadith: 'سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ', hadithEn: 'Glory be to Him who has placed this at our service, and we could not have done it by ourselves; and surely to our Lord we are to return.', source: 'رواه مسلم' },
                { id: 'tr2', title: 'التكبير عند الصعود والتسبيح عند النزول', titleEn: 'Takbir & Tasbih', hadith: 'كُنَّا إِذَا صَعِدْنَا كَبَّرْنَا، وَإِذَا نَزَلْنَا سَبَّحْنَا', hadithEn: 'When we went up a hill we said Allahu Akbar, and when we went down we said SubhanAllah.', source: 'رواه البخاري' },
                { id: 'tr3', title: 'دعاء الرجوع من السفر', titleEn: 'Dua returning from travel', hadith: 'آيِبُونَ تَائِبُونَ عَابِدُونَ لِرَبِّنَا حَامِدُونَ', hadithEn: 'Returning, repenting, worshipping, and praising our Lord.', source: 'رواه مسلم' },
                { id: 'tr4', title: 'صلاة ركعتين عند العودة من السفر', titleEn: '2 Rak\'ahs after return', hadith: 'كَانَ النَّبِيُّ ﷺ إِذَا قَدِمَ مِنْ سَفَرٍ بَدَأَ بِالْمَسْجِدِ فَرَكَعَ فِيهِ رَكْعَتَيْنِ', hadithEn: 'When the Prophet ﷺ returned from a journey, he would start with the mosque and pray two rak\'ahs.', source: 'متفق عليه' },
                { id: 'tr5', title: 'توديع المسافر ومن يودعه', titleEn: 'Traveler\'s farewell', hadith: 'أَسْتَوْدِعُكُمُ اللَّهَ الَّذِي لَا تَضِيعُ وَدَائِعُهُ', hadithEn: 'I entrust you to Allah, whose trusts are never lost.', source: 'رواه أحمد' }
            ],
            nature: [
                { id: 'n1', title: 'دعاء رؤية الهلال', titleEn: 'New Moon Supplication', hadith: 'اللَّهُمَّ أَهِلَّهُ علَيْنَا بِاليُمْنِ وَالإِيمَانِ وَالسَّلامَةِ وَالإِسْلامِ، رَبِّي وَرَبُّكَ اللَّه', hadithEn: 'O Allah, bring it over us with security and faith, and safety and Islam. My Lord and your Lord is Allah.', source: 'رواه الترمذي' },
                { id: 'n2', title: 'الدعاء عند هبوب الريح', titleEn: 'Supplication for Wind', hadith: 'اللَّهُمَّ إنِّي أَسْأَلُكَ خَيْرَهَا، وَخَيْرَ ما فِيهَا، وَخَيْرَ ما أُرْسِلَتْ به، وَأَعُوذُ بكَ مِن شَرِّهَا، وَشَرِّ ما فِيهَا، وَشَرِّ ما أُرْسِلَتْ به', hadithEn: 'O Allah, I ask You for its good, the good it contains, and the good with which it was sent.', source: 'رواه مسلم' },
                { id: 'n3', title: 'النهي عن سب الريح', titleEn: 'Do not curse the wind', hadith: 'لَا تَسُبُّوا الرِّيحَ، فَإِنَّهَا مِنْ رُوحِ اللَّهِ تَأْتِي بِالرَّحْمَةِ وَالْعَذَابِ، وَلَكِنْ سَلُوا اللَّهَ مِنْ خَيْرِهَا وَتَعَوَّذُوا بِاللَّهِ مِنْ شَرِّهَا', hadithEn: 'Do not curse the wind... but ask Allah for its good and seek refuge in Him from its evil.', source: 'رواه الترمذي' },
                { id: 'n4', title: 'إماطة الأذى عن الطريق', titleEn: 'Removing harm from path', hadith: 'وَتُمِييطُ الْأَذَى عَنِ الطَّرِيقِ صَدَقَةٌ', hadithEn: 'And removing a harmful thing from the road is charity.', source: 'متفق عليه' },
                { id: 'n5', title: 'التسبيح عند الرعد', titleEn: 'Tasbih during Thunder', hadith: 'سُبْحَانَ الَّذِي يُسَبِّحُ الرَّعْدُ بِحَمْدِهِ وَالْمَلَائِكَةُ مِنْ خِيفَتِهِ', hadithEn: 'Glory be to Him whom the thunder glorifies with His praise and the angels from fear of Him.', source: 'رواه مالك' },
                { id: 'n6', title: 'فضل الغرس والزرع', titleEn: 'Planting Trees and Sowing', hadith: 'مَا مِنْ مُسْلِمٍ يَغْرِسُ غَرْساً أَوْ يَزْرَعُ زَرْعاً، فَيَأْكُلُ مِنْهُ طَيْرٌ أَوْ إِنْسَانٌ أَوْ بَهِيمَةٌ، إِلَّا كَانَ لَهُ بِهِ صَدَقَةٌ', hadithEn: 'No Muslim plants a tree or sows a seed and then a bird, or a person, or an animal eats from it, but it is regarded as a charity for him.', source: 'متفقٌ عليه' },
                { id: 'n7', title: 'الرحمة والرفق بالحيوان', titleEn: 'Mercy and Kindness to Animals', hadith: 'فِي كُلِّ كَبِدٍ رَطْبَةٍ أَجْرٌ', hadithEn: 'In every living being there is a reward for charity.', source: 'متفقٌ عليه' }
            ],
            knowledge: [
                { id: 'kn1', title: 'فضل طلب العلم', titleEn: 'Virtue of seeking knowledge', hadith: 'مَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللَّهُ لَهُ بِهِ طَرِيقًا إِلَى الْجَنَّةِ', hadithEn: 'Whoever follows a path in the pursuit of knowledge, Allah will make a path to Paradise easy for him.', source: 'رواهُ مسلم' },
                { id: 'kn2', title: 'دعاء طلب العلم', titleEn: 'Dua for Knowledge', hadith: 'اللَّهُمَّ انْفَعْنِي بِمَا عَلَّمْتَنِي، وَعَلِّمْنِي مَا يَنْفَعُنِي، وَزِدْنِي عِلْمًا', hadithEn: 'O Allah, benefit me with what You have taught me, and teach me that which will benefit me, and increase me in knowledge.', source: 'رواهُ الترمذي وابن ماجه' },
                { id: 'kn3', title: 'فضل قراءة القرآن', titleEn: 'Virtue of Reciting Quran', hadith: 'اقْرَؤُوا الْقُرْآنَ فَإِنَّهُ يَأْتِي يَوْمَ الْقِيَامَةِ شَفِيعًا لِأَصْحَابِهِ', hadithEn: 'Recite the Quran, for on the Day of Resurrection it will come as an intercessor for those who recite it.', source: 'رواهُ مسلم' },
                { id: 'kn4', title: 'تزيين القرآن بالصوت', titleEn: 'Beautifying Voice with Quran', hadith: 'زَيِّنُوا الْقُرْآنَ بِأَصْوَاتِكُمْ', hadithEn: 'Beautify the Quran with your voices.', source: 'رواهُ أبو داود والنسائي' }
            ],
            sleep: [
                { id: 's1', title: 'النوم على وضوء', titleEn: 'Sleeping with Wudu', hadith: 'إِذَا أَتَيْتَ مَضْجَعَكَ فَتَوَضَّأْ وُضُوءَكَ لِلصَّلَاةِ', hadithEn: 'When you go to bed, perform wudu as you do for prayer.', source: 'متفق عليه' },
                { id: 's2', title: 'نفض الفراش', titleEn: 'Dusting the Bed', hadith: 'إِذَا أَوْى أَحَدُكُمْ إِلَى فِرَاشِهِ فَلْيَنْفُضْ فِرَاشَهُ بِدَاخِلَةِ إِزَارِهِ، فَإِنَّهُ لَا يَدْرِي مَا خَلَفَهُ عَلَيْهِ', hadithEn: 'When one of you goes to his bed, he should dust it off with the inner part of his lower garment, for he does not know what followed him onto it.', source: 'متفق عليه' },
                { id: 's3', title: 'النوم على الشق الأيمن', titleEn: 'Sleeping on Right Side', hadith: 'ثُمَّ اضْطَجِعْ عَلَى شِقِّكَ الْأَيْمَنِ (جزء من حديث وضوء النوم)', hadithEn: 'Then lie down on your right side.', source: 'متفق عليه' },
                { id: 's4', title: 'قراءة المعوذات والنفث', titleEn: 'Reciting Mauwidhat & Blowing', hadith: 'أَنَّ النَّبِيَّ ﷺ كَانَ إِذَا أَوَى إِلَى فِرَاشِهِ كُلَّ لَيْلَةٍ جَمَعَ كَفَّيْهِ ثُمَّ نَفَثَ فِيهِمَا فَقَرَأَ فِيهِمَا: قُلْ هُوَ اللَّهُ أَحَدٌ وَ قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ وَ قُلْ أَعُوذُ بِرَبِّ النَّاسِ', hadithEn: 'Every night when he went to bed, he would cup his hands, blow into them and recite the last three Surahs of the Quran.', source: 'رواه البخاري' },
                { id: 's5', title: 'حمد الله عند النوم', titleEn: 'Alhamdulillah before sleep', hadith: 'الَحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنَا وَسَقَانَا وَكَفَانَا وَآوَانَا، فَكَمْ مِمَّنْ لَا كَافِيَ لَهُ وَلَا مُؤْوِيَ', hadithEn: 'Praise be to Allah who has fed us and given us drink, and satisfied us and sheltered us; for how many are those who have no one to provide for them or shelter them.', source: 'رواه مسلم' }
            ],
            forgotten: [
                { id: 'fg1', title: 'صلاة ركعتين عقب الذنب (التوبة)', titleEn: 'Prayer of Repentance', hadith: 'مَا مِنْ عَبْدٍ يُذْنِبُ ذَنْباً، فَيُحْسِنُ الطُّهُورَ، ثُمَّ يَقُومُ فَيُصَلِّي رَكْعَتَيْنِ، ثُمَّ يَسْتَغْفِرُ اللَّهَ، إِلَّا غَفَرَ اللَّهُ لَهُ', hadithEn: 'Any servant who commits a sin, performs wudu well, then stands and prays two rak\'ahs and asks Allah for forgiveness, Allah will forgive him.', source: 'رواهُ الترمذي' },
                { id: 'fg2', title: 'المضمضة من اللبن', titleEn: 'Rinsing after Milk', hadith: 'أَنَّ النَّبِيَّ ﷺ شَرِبَ لَبَناً فَمَضْمَضَ وَقَالَ: إِنَّ لَهُ دَسَماً', hadithEn: 'The Prophet ﷺ drank milk, then rinsed his mouth and said: It has fat.', source: 'متفقٌ عليه' },
                { id: 'fg3', title: 'المشي حافياً أحياناً', titleEn: 'Walking Barefoot', hadith: 'كَانَ النَّبِيُّ ﷺ يَنْهَى عَنْ كَثِيرٍ مِنَ الْإِرْفَاهِ، وَيَأْمُرُنَا أَنْ نَحْتَفِيَ أَحْيَاناً', hadithEn: 'The Prophet ﷺ used to forbid much luxury and ordered us to go barefoot sometimes.', source: 'رواهُ أبو داود' },
                { id: 'fg4', title: 'إصلاح اللقمة الساقطة وتناولها', titleEn: 'Picking up & Eating fallen morsel', hadith: 'إِذَا وَقَعَتْ لُقْمَةُ أَحَدِكُمْ فَلْيأْخُذْهَا، فَلْيُمِطْ مَا كَانَ بِهَا مِنْ أَذَى وَلْيَأْكُلْهَا، وَلَا يَدَعْهَا لِلشَّيْطَانِ', hadithEn: 'If a morsel falls, he should pick it up, remove any dirt from it, and eat it, and not leave it for Satan.', source: 'رواهُ مسلم' },
                { id: 'fg5', title: 'سجدة الشكر عند البشارة', titleEn: 'Prostration of Gratitude', hadith: 'كَانَ رَسُولُ اللَّهِ ﷺ إِذَا جَاءَهُ أَمْرُ سُرُورٍ أَوْ بُشِّرَ بِهِ خَرَّ سَاجِداً شَاكِراً لِلَّهِ', hadithEn: 'When anything caused him joy, or he was given glad tidings, he would prostrate in gratitude to Allah.', source: 'رواهُ أبو داود' },
                { id: 'fg6', title: 'التبرك بماء المطر (سنة المطر)', titleEn: 'Seeking blessings from rain', hadith: 'حَسَرَ رَسُولُ اللَّهِ ﷺ ثَوْبَهُ، حَتَّى أَصَابَهُ مِنَ الْمَطَرِ، وَقالَ: لأَنَّهُ حَدِيثُ عَهْدٍ بِرَبِّهِ تَعَالَى', hadithEn: 'The Messenger of Allah ﷺ uncovered part of his body so that the rain fell on it and said: Because it has just come from its Lord.', source: 'رواهُ مسلم' },
                { id: 'fg7', title: 'إخبار الأخ بحبه في الله', titleEn: 'Telling brother "I love you"', hadith: 'إِذَا أَحَبَّ الرَّجُلُ أَخَاهُ فَلْيُخْبِرْهُ أَنَّهُ يُحِبُّهُ', hadithEn: 'If a man loves his brother, he should tell him that he loves him.', source: 'رواهُ أبو داود' },
                { id: 'fg8', title: 'البدء باليمين في اللباس والوضوء', titleEn: 'Right first for dressing', hadith: 'إِذَا لَبِسْتُمْ، وَإِذَا تَوَضَّأْتُمْ، فَابْدَأُوا بِأَيَامِنِكُمْ', hadithEn: 'When you dress, and when you perform wudu, start with your right side.', source: 'رواهُ أبو داود' },
                { id: 'fg9', title: 'تشميت العاطس', titleEn: 'Responding to Sneeze', hadith: 'إِذَا عَطَسَ أَحَدُكُمْ فَلْيَقُلِ: الْحَمْدُ لِلَّهِ، وَلْيَقُلْ لَهُ أَخُوهُ أَوْ صَاحِبُهُ: يَرْحَمُكَ اللَّهُ، فَإِذَا قَالَ لَهُ: يَرْحَمُكَ اللَّهُ، فَلْيَقُلْ: يَهْدِيكُمُ اللَّهُ وَيُصْلِحُ بَالَكُمْ', hadithEn: 'If one of you sneezes and says Alhamdulillah, let his brother say Yarhamukallah... then say Yahdikumullah...', source: 'رواهُ البخاري' },
                { id: 'fg10', title: 'الذكر بعد السلام من الوتر', titleEn: 'Supplication After Witr Prayer', hadith: 'كَانَ رَسُولُ اللَّهِ ﷺ إِذَا سَلَّمَ مِنَ الْوِتْرِ قَالَ: سُبْحَانَ الْمَلِكِ الْقُدُّوسِ ثَلَاثَ مَرَّاتٍ يَمُدُّ فِي الثَّالِثَةِ', hadithEn: 'The Messenger of Allah ﷺ used to say after Witr of three rak\'ahs: Glory be to the Sovereign, the Most Holy (three times), lengthening his voice on the third.', source: 'رواهُ النسائي' },
                { id: 'fg11', title: 'ذكر الله عند دخول السوق', titleEn: 'Supplication for Entering the Market', hadith: 'لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، يُحْيِي وَيُمِيتُ وَهُوَ حَيٌّ لَا يَمُوتُ بِيَدِهِ الْخَيْرُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ', hadithEn: 'None has the right to be worshipped but Allah alone... written for him will be a million good deeds...', source: 'رواهُ الترمذي' }
            ]
        };

        let currentTab = 'waking';
        let currentLang = localStorage.getItem('ramadan_lang') || 'ar';
        let state = JSON.parse(localStorage.getItem('sunnah_tracker')) || {};

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            localStorage.setItem('ramadan_lang', currentLang);
            updateUI();
        }

            ar: {

                tabFood: "Food", tabHome: "Home", tabDressing: "Dressing", tabSocial: "Social", tabEthics: "Ethics",
                tabTravel: "Travel", tabNature: "Nature", tabKnowledge: "Knowledge", tabSleep: "Sleep", tabForgotten: "Forgotten"
            }
        };

        function updateUI() {
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langBtn').textContent = currentLang === 'ar' ? 'English' : 'عربي';

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang][key]) el.textContent = translations[currentLang][key];
            });

            renderList();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('onclick').includes(tab));
            });
            renderList();
        }

        function renderList() {
            const list = document.getElementById('sunnahList');
            list.innerHTML = '';
            const items = sunnahData[currentTab];

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = `sunnah-card ${state[item.id] ? 'completed' : ''}`;
                card.onclick = () => toggleSunnah(item.id);

                card.innerHTML = `
                    <div class="sunnah-header">
                        <h3 class="sunnah-title">${currentLang === 'ar' ? item.title : item.titleEn}</h3>
                        <div class="check-icon"><i class="fas fa-check"></i></div>
                    </div>
                    <div class="sunnah-hadith">${currentLang === 'ar' ? item.hadith : item.hadithEn}</div>
                    <div class="sunnah-source">${item.source}</div>
                `;
                list.appendChild(card);
            });
        }

        function toggleSunnah(id) {
            state[id] = !state[id];
            localStorage.setItem('sunnah_tracker', JSON.stringify(state));
            renderList();
        }

        updateUI();
    </script>
</body>

</html>
